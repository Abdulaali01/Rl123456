/* ---- رموز التمديد: سلسلة SHA-256 (بدون مكتبات) ---- */
function sha256(bytes){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  let H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;
  const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8);const W=new Uint32Array(64);const r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(r(a,7)^r(a,18)^(a>>>3))+W[i-7]+(r(b,17)^r(b,19)^(b>>>10)))|0}
    let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+W[i])|0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
    H=H.map((v,i)=>(v+[a,b,c,d,e,f,g,h][i])|0)}
  const out=new Uint8Array(32);const ov=new DataView(out.buffer);H.forEach((v,i)=>ov.setUint32(i*4,v));return out}
const AL="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
const h10=b=>sha256(b).slice(0,10);
const toHex=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join(""),fromHex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
function toCode(b){let v=0n;for(const x of b)v=(v<<8n)|BigInt(x);let o="";for(let i=0;i<16;i++){o=AL[Number(v%32n)]+o;v/=32n}return o.replace(/(.{4})(?=.)/g,"$1-")}
function fromCode(c){c=c.toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length!==16)return null;let v=0n;for(const ch of c){const i=AL.indexOf(ch);if(i<0)return null;v=v*32n+BigInt(i)}
  const b=new Uint8Array(10);for(let i=9;i>=0;i--){b[i]=Number(v&255n);v>>=8n}return v===0n?b:null}
const CHAIN=30;
function chainAt(seed,k){let x=seed;for(let i=0;i<CHAIN-k;i++)x=h10(x);return x} // k=0 anchor … k=CHAIN seed

const EXTKEY=()=>"ext_"+(EMB&&EMB.fid||"");
function extState(){try{return JSON.parse(localStorage.getItem(EXTKEY())||"null")}catch(_){return null}}
let REMOTE=null,CLOSED=false,RSTATE="";
async function fetchRemote(){
  if(!EMB||!EMB.fid||!FB_DB)return;
  RSTATE="checking";REMOTE=null;
  if(!/^[a-f0-9]{12,64}$/i.test(EMB.fid)||navigator.onLine===false){RSTATE="fail";return}
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),10000);
  try{const r=await fetch(FB_DB+"/files/"+EMB.fid+".json?t="+Date.now(),{signal:ctl.signal,cache:"no-store"});
    if(!r.ok){RSTATE="err"+r.status;return}
    const d=await r.json();if(navigator.onLine===false){RSTATE="fail";return}
    REMOTE=d&&typeof d==="object"?d:null;RSTATE=REMOTE?"ok":"none";
  }catch(e){RSTATE="fail"}finally{clearTimeout(tm)}
}
function effectiveExpiry(){const base=REMOTE&&REMOTE.until?REMOTE.until:(EXPIRES?new Date(EXPIRES).getTime():null);if(base===null)return null;let t=base;const x=EMB&&!EMB.linkMode&&extState();if(x&&x.until>t)t=x.until;return t}

function tryExtend(code){if(!EMB||!EMB.anchor)return false;const b=fromCode(code);if(!b)return false;
  const st=extState()||{k:0,cur:EMB.anchor};let x=b;
  for(let j=1;j<=CHAIN-st.k;j++){x=h10(x);if(toHex(x)===st.cur){const until=Date.now()+(EMB.hours||24)*3600e3;
      try{localStorage.setItem(EXTKEY(),JSON.stringify({k:st.k+j,cur:toHex(b),until}))}catch(_){return false}return true}}
  return false}
const KEY=()=>"rep_v3_"+(EMB?"recipient_"+EMB.fid:"owner")+"_"+toHex(sha256(new TextEncoder().encode(JSON.stringify([docName,IDS])))).slice(0,32);

/* Persist the complete current report, including page images and replacements. */
let draftDBPromise=null,draftTimer=null,draftWarning=false;
const draftKey=()=>EMB&&EMB.fid?"recipient_"+EMB.fid:"owner_current";
function draftDB(){
  if(!draftDBPromise)draftDBPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open("taif_report_drafts",1);
    r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("drafts"))r.result.createObjectStore("drafts")};
    r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);
  }).catch(e=>{draftDBPromise=null;throw e});
  return draftDBPromise;
}
async function saveDraft(){
  clearTimeout(draftTimer);if(!PAGES.length)return;
  try{
    const db=await draftDB();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction("drafts","readwrite");
      tx.objectStore("drafts").put({name:docName,pages:PAGES,ids:IDS,state,updated:Date.now()},draftKey());
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error("aborted"));
    });
    draftWarning=false;
  }catch(e){console.warn("Draft save failed",e);if(!draftWarning){draftWarning=true;toast("تعذّر الحفظ التلقائي. جهّز PDF وحمّله قبل مغادرة الصفحة")}}
}
function scheduleDraft(){LAST_PDF=null;clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,350)}
async function readDraft(){
  try{const db=await draftDB();return await new Promise((resolve,reject)=>{
    const tx=db.transaction("drafts","readonly"),r=tx.objectStore("drafts").get(draftKey());
    r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error);
  })}catch(e){console.warn("Draft restore failed",e);toast("الحفظ التلقائي غير متاح في هذا المتصفح");return null}
}
function validDraft(d){return d&&Array.isArray(d.pages)&&d.pages.length&&Array.isArray(d.ids)&&d.ids.length===d.pages.length&&d.state&&typeof d.state==="object"}

function showClosed(t,m){if($("#done")){$("#done").innerHTML="";$("#done").hidden=true}CLOSED=true;$("#bar").hidden=true;$("#main").hidden=true;$("#gate").hidden=false;
  const ext=EMB&&!EMB.linkMode&&EMB.anchor&&ACTIVE&&RSTATE==="ok"&&!(REMOTE&&REMOTE.active===false);
  $("#gateForm").innerHTML=`<h2>${t}</h2><p>${m}</p>`+(ext?`<p>إذا أرسل لك صاحب الملف رمز تمديد، اكتبه هنا:</p><input id="extIn" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" aria-label="رمز التمديد" style="letter-spacing:.08em;font-size:1.1rem;direction:ltr"><div class="err" id="extErr"></div><button type="submit">تمديد</button>`:"");
  if(ext)$("#gateForm").onsubmit=async e=>{e.preventDefault();if(tryExtend($("#extIn").value)){REMOTE=null;location.reload();return}else $("#extErr").textContent="الرمز غير صحيح أو مستخدم من قبل"};$("#gateForm").insertAdjacentHTML("beforeend",EMB&&EMB.fid&&FB_DB?`<button type="button" id="recheck" class="b-link" style="margin-top:4px">🔄 تحقق مرة أخرى</button>`:"");const rc=$("#recheck");if(rc)rc.onclick=async()=>{rc.disabled=true;await fetchRemote();if(!stopped())location.reload();else{rc.disabled=false;toast("ما زالت متوقفة")}}}
function closeNow(){if(EMB&&(!EMB.fid||!FB_DB||navigator.onLine===false||RSTATE!=="ok"||!REMOTE)){showClosed("يلزم التحقق عبر الإنترنت","اتصل بالإنترنت ثم اضغط تحقق مرة أخرى. لن يُفتح الملف أو يُجهّز PDF حتى يتم التحقق من صلاحية الملف.");return}if(REMOTE&&(REMOTE.active===false||REMOTE.deleted))showClosed("الصفحة متوقفة","أوقف صاحب الملف هذه الصفحة.");else showClosed("انتهت المدة",STOP_MSG)}
setTimeout(async()=>{if(EMB&&EMB.fid&&FB_DB){$("#gate").hidden=false;$("#gateForm").innerHTML="<h2>جارٍ التحقق…</h2>";await fetchRemote()}
  if(stopped())closeNow();else{

      if(stopped())closeNow();else await openApp();
    }catch(e){console.warn(e);showClosed("تعذّر فتح النموذج",e.message||"تحقق من الرابط والاتصال")}
  }
  if(!EMB)await restoreSent();renderSent();
  setInterval(async()=>{await fetchRemote();if(stopped()){if(!CLOSED)closeNow()}else if(CLOSED)location.reload();else if(EMB)$("#status").textContent="اكتب في المربعات وغيّر الصور، ثم اضغط «تجهيز PDF»."+untilText();else if(!EMB)checkReplies()},15000)},0);

function remoteText(){if(!EMB||!EMB.fid)return "";return {ok:" · 🌐 متصل بالتحكم",none:" · ⚠️ الملف غير مسجّل في التحكم",fail:" · ⚠️ لا اتصال بالتحكم"}[RSTATE]||(RSTATE?" · ⚠️ خطأ "+RSTATE:"")}
function untilText(){const t=effectiveExpiry();if(t===null)return "";const d=new Date(t);return remoteText()+" · متاح حتى "+d.toLocaleString("ar-SA-u-ca-gregory",{weekday:"long",hour:"numeric",minute:"2-digit"})}

async function openApp(){
  $("#gate").hidden=true;$("#bar").hidden=false;$("#main").hidden=false;
  if(EMB){$("#btnAttach").hidden=true;docName=EMB.name||docName;load(EMB.pages,EMB.ids)}
  else $("#status").textContent="جارٍ استعادة العمل المحفوظ…";
  const d=await readDraft();
  if(validDraft(d)&&(!EMB||JSON.stringify(d.ids)===JSON.stringify(EMB.ids))){
    docName=d.name||docName;load(d.pages,d.ids);
    IDS.forEach(id=>{const old=d.state[id];if(old)for(const k of ["ifada","coords","before","after","note"])if(typeof old[k]==="string")state[id][k]=old[k]});
    build();toast("تم استعادة ملف البلاغات والصور والإفادات المحفوظة");
  }else if(!EMB)$("#status").textContent="ابدأ بإرفاق ملف PDF. ("+VER+")";
  if(canReturn())lockSubmissionUI();
}

/* ---- الكتابة السابقة: تُقرأ من الملف وتُمسح من خلفية الصفحة لتظهر قابلة للتعديل ---- */
function boxText(items,vp,W,H,k){
  const b=BOX[k],x0=b[0]/100*W,y0=b[1]/100*H,x1=x0+b[2]/100*W,y1=y0+b[3]/100*H,rows=[];
  for(const it of items){if(!it.str||!it.str.trim())continue;
    const m=pdfjsLib.Util.transform(vp.transform,it.transform),x=m[4],y=m[5],w=(it.width||0)*vp.scale,cx=x+w/2,fh=Math.hypot(m[2],m[3])||10;
    if(cx<x0||cx>x1||y<y0||y>y1+4)continue;
    let r=rows.find(r=>Math.abs(r.y-y)<Math.max(4,fh*.5));if(!r){r={y,p:[]};rows.push(r)}r.p.push({x,s:it.str})}
  rows.sort((a,b)=>a.y-b.y);
  return rows.map(r=>{const rtl=r.p.some(p=>/[\u0600-\u06FF]/.test(p.s));r.p.sort((a,b)=>rtl?b.x-a.x:a.x-b.x);return r.p.map(p=>p.s).join(" ").replace(/\s+/g," ").trim()}).filter(Boolean).join("\n");
}
function cleanBoxes(ctx,W,H){
  for(const k of ["ifada","coords"]){const b=BOX[k],i=Math.max(3,W*.004);
    const x=Math.round(b[0]/100*W+i),y=Math.round(b[1]/100*H+i),w=Math.round(b[2]/100*W-2*i),h=Math.round(b[3]/100*H-2*i);if(w<4||h<4)continue;
    const d=ctx.getImageData(x,y,w,h).data,cnt=new Map();let best=null,bn=0;
    for(let yy=0;yy<h;yy+=3)for(let xx=0;xx<w;xx+=3){const p=(yy*w+xx)*4,q=(d[p]>>4)<<8|(d[p+1]>>4)<<4|(d[p+2]>>4);
      const e=cnt.get(q)||{n:0,r:0,g:0,b:0};e.n++;e.r+=d[p];e.g+=d[p+1];e.b+=d[p+2];cnt.set(q,e);if(e.n>bn){bn=e.n;best=e}}
    ctx.fillStyle=best?`rgb(${Math.round(best.r/best.n)},${Math.round(best.g/best.n)},${Math.round(best.b/best.n)})`:"#fff";
    const X=Math.round(b[0]/100*W)-1,Y=Math.round(b[1]/100*H)-1,BW=Math.round(b[2]/100*W)+2,BH=Math.round(b[3]/100*H)+2;
    ctx.fillRect(X,Y,BW,BH);
    ctx.save();ctx.setLineDash([Math.max(3,W*.004),Math.max(2,W*.003)]);ctx.lineWidth=Math.max(1,W*.0015);ctx.strokeStyle="#203a4c";
    const g=Math.max(3,W*.004);ctx.strokeRect(X+g,Y+g,BW-2*g,BH-2*g);ctx.restore()}
}
function readEmbedded(raw){try{const head=new TextDecoder("latin1").decode(raw.subarray(0,Math.min(raw.length,8e6)));const m=head.match(/%TAIF:([A-Za-z0-9+\/=]+)/);if(!m)return null;
  const o=JSON.parse(new TextDecoder().decode(decode64(m[1])));return o&&o.v===1&&Array.isArray(o.data)?o:null}catch(_){return null}}
function embedMeta(){return bytes64(new TextEncoder().encode(JSON.stringify({v:1,ids:IDS,data:IDS.map(id=>({ifada:state[id].ifada||"",coords:state[id].coords||""}))})))}

$("#btnAttach").onclick=()=>$("#pdfIn").click();
$("#pdfIn").onchange=async()=>{const f=$("#pdfIn").files[0];$("#pdfIn").value="";if(!f)return;
  const normalizedName=n=>String(n).normalize("NFC").trim().replace(/\.pdf$/i,"").trim().toLocaleLowerCase();
  if(PAGES.length&&normalizedName(f.name)===normalizedName(docName)){
    toast("هذا الملف موجود بالفعل بنفس الاسم. احذفه أولاً إذا أردت إرفاقه من جديد");return;
  }
  if(!window.pdfjsLib){toast("تحتاج اتصالاً بالإنترنت لقراءة ملف PDF");return}
  const b=$("#btnAttach");b.disabled=true;
  try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const raw=new Uint8Array(await f.arrayBuffer());const saved=readEmbedded(raw);
    const pdf=await pdfjsLib.getDocument({data:raw}).promise;const pages=[],ids=[],texts=[];
    for(let n=1;n<=pdf.numPages;n++){b.textContent=`جارٍ القراءة ${n}/${pdf.numPages}…`;
      const pg=await pdf.getPage(n);const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:910/v1.width});
      const c=el("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const ctx=c.getContext("2d",{willReadFrequently:true});ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
      await pg.render({canvasContext:ctx,viewport:vp}).promise;
      let items=[];try{items=(await pg.getTextContent()).items}catch(_){}
      let id="";const m=items.map(x=>x.str).join(" ").match(/INC-\d{2}-\d{2}-\d{4,}/);if(m)id=m[0];
      texts.push({ifada:boxText(items,vp,c.width,c.height,"ifada"),coords:boxText(items,vp,c.width,c.height,"coords")});
      cleanBoxes(ctx,c.width,c.height);
      pages.push(c.toDataURL("image/jpeg",.8));
      ids.push(id&&!ids.includes(id)?id:`صفحة ${n}`)}
    const useSaved=saved&&saved.data.length===pages.length;
    const finalIds=useSaved&&Array.isArray(saved.ids)&&saved.ids.length===pages.length&&new Set(saved.ids).size===pages.length?saved.ids.map(String):ids;
    docName=f.name.replace(/\.pdf$/i,"");load(pages,finalIds);
    let found=0;
    finalIds.forEach((id,i)=>{const s=useSaved?saved.data[i]:texts[i];for(const k of ["ifada","coords"]){const v=s&&typeof s[k]==="string"?s[k].trim():"";if(v&&!state[id][k]){state[id][k]=v;found++}}});
    if(found){build();store()}
    $("#picker").open=true;
    toast(`تم تجهيز ${pages.length} صفحة`+(found?" · ظهرت الكتابة السابقة للتعديل":""))}
  catch(e){console.warn(e);toast("تعذّرت قراءة الملف، تأكد أنه PDF سليم")}
  finally{b.disabled=false;b.textContent="📎 إرفاق ملف PDF"}};

function load(pages,ids){PAGES=pages;IDS=ids;state={};SEL.clear();IDS.forEach(id=>state[id]={ifada:"",coords:"",before:"",after:"",note:""});
  if(EMB&&EMB.initialState)IDS.forEach(id=>{for(const k of ["ifada","coords","before","after","note"]){const v=EMB.initialState[id]?.[k];if(typeof v==="string")state[id][k]=v}});
  restore();
  $("#empty").hidden=true;$("#ttl").textContent=`${docName} · ${IDS.length} بلاغ`;$("#btnPdf").hidden=!!EMB&&!canReturn();$("#btnWa").hidden=false;$("#btnMail").hidden=false;$("#btnWipeAll").hidden=false;$("#btnPdf").textContent=EMB&&EMB.returnToken?(HAS_SENT?"📤 إعادة الإرسال للمرسل":"📤 إرسال للمرسل"):"📄 تجهيز PDF";$("#btnLink").hidden=!!EMB;$("#btnDelete").hidden=!!EMB;$("#btnHtml").hidden=!!EMB;$("#done").hidden=true;
  $("#status").textContent="اكتب في المربعات وغيّر الصور، ثم اضغط «تجهيز PDF». ("+VER+")"+(EMB?untilText():"");$("#hrsBox").hidden=!!EMB;$("#retBox").hidden=!!EMB;build();scheduleDraft()}

function build(){const list=$("#list");list.innerHTML="";
  IDS.forEach((id,i)=>{const nt=el("div",{className:"pnote",id:"note_"+i});list.append(nt);
    const s=el("section",{className:"sheet"});s.append(el("img",{src:PAGES[i],alt:"بلاغ "+id}),el("span",{className:"tag",textContent:`${i+1} / ${IDS.length}`}));
    for(const k of ["ifada","coords"]){const b=BOX[k];const ta=el("textarea",{id:`${k}_${i}`,className:k==="coords"?"c":"",placeholder:k==="ifada"?"اكتب الإفادة هنا":"اكتب الإحداثيات",value:state[id][k]});
      ta.dir="auto";ta.setAttribute("aria-label",(k==="ifada"?"الإفادة":"إحداثيات الموقع")+" — "+id);Object.assign(ta.style,{left:b[0]+"%",top:b[1]+"%",width:b[2]+"%",height:b[3]+"%"});
      ta.oninput=()=>{state[id][k]=ta.value;store()};s.append(ta)}
    for(const k of ["before","after"]){const sl=el("div",{className:"slot "+k,hidden:true},`<img alt=""><span class="lab">${k==="before"?"قبل":"بعد"}</span>`);sl.style.left=SLOT[k]+"%";
      if(state[id][k]){sl.querySelector("img").src=state[id][k];sl.hidden=false}
      const inp=el("input",{type:"file",accept:"image/*",hidden:true});const btn=el("button",{type:"button",className:"pick "+k,textContent:k==="before"?"📷 تغيير صورة قبل":"📷 تغيير صورة بعد"});
      btn.onclick=()=>inp.click();inp.onchange=async()=>{const f=inp.files[0];inp.value="";if(!f)return;
        try{state[id][k]=await shrink(f);sl.querySelector("img").src=state[id][k];sl.hidden=false;scheduleDraft();toast("تم تغيير الصورة")}catch(_){toast("تعذّرت قراءة الصورة")}};
      s.append(sl,inp,btn)}
    const wb=el("button",{type:"button",className:"wipe",textContent:"🧽 مسح الكتابة"});
    wb.onclick=async()=>{if(!confirm("مسح كل الكتابة في الإفادة والإحداثيات لهذا البلاغ لتكتب من جديد؟"))return;wb.disabled=true;
      try{await wipePage(i);toast("تم مسح الكتابة — اكتب من جديد")}catch(e){toast("تعذّر المسح")}finally{wb.disabled=false}};
    s.append(wb);list.append(s);paintNote(i)});
  renderPicker()}

/* ---- قائمة الصفحات: بحث، مربع اختيار، وشرح لكل صفحة (للمرسل فقط) ---- */
const normDigits=s=>String(s).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
function paintNote(i){const n=document.getElementById("note_"+i);if(!n||!IDS[i])return;const v=(state[IDS[i]].note||"").trim();n.hidden=!v;n.textContent=v?"📝 شرح: "+v:""}
function pkCount(){const n=SEL.size;$("#pkCount").textContent=n?`· ${n} مختارة من ${IDS.length}`:`· ${IDS.length} صفحة`;$("#pkLink").textContent=n?`🔗 رابط لـ ${n} صفحة`:"🔗 رابط للصفحات المختارة"}
function pkFilter(){const q=normDigits($("#pkSearch").value).trim().toLowerCase();let shown=0;
  $("#pkList").querySelectorAll("li").forEach(li=>{const i=+li.dataset.i,id=IDS[i];
    const hay=((i+1)+" صفحة "+(i+1)+" "+id+" "+(state[id].note||"")).toLowerCase();
    const ok=!q||(/^\d+$/.test(q)?String(i+1)===q||id.toLowerCase().includes(q):hay.includes(q));li.hidden=!ok;if(ok)shown++});
  $("#pkEmpty").hidden=!!shown||!IDS.length}
function renderPicker(){const p=$("#picker");if(EMB||!IDS.length){p.hidden=true;return}p.hidden=false;
  const ul=$("#pkList");ul.innerHTML="";
  IDS.forEach((id,i)=>{const li=el("li");li.dataset.i=i;
    const cb=el("input",{type:"checkbox",checked:SEL.has(id)});cb.setAttribute("aria-label","اختيار الصفحة "+(i+1));
    cb.onchange=()=>{if(cb.checked)SEL.add(id);else SEL.delete(id);pkCount()};
    const lab=el("label",{className:"pk-lab"});lab.append(cb,el("span",{textContent:"صفحة "+(i+1)}),el("small",{textContent:/^صفحة \d+$/.test(id)?"":id}));
    const nb=el("button",{type:"button",className:"b-link",textContent:state[id].note?"📝 تعديل الشرح":"📝 إضافة شرح"});
    const go=el("button",{type:"button",className:"b-link",textContent:"👁 عرض"});go.setAttribute("aria-label","عرض الصفحة "+(i+1));
    go.onclick=()=>{const n=document.getElementById("note_"+i),t=document.getElementById("ifada_"+i);const target=n&&!n.hidden?n:(t&&t.closest(".sheet"));if(target)target.scrollIntoView({behavior:"smooth",block:"start"})};
    const ta=el("textarea",{className:"pk-note",placeholder:"اكتب شرحاً لهذه الصفحة يظهر للمستفيد فوقها",value:state[id].note||"",hidden:true});
    ta.setAttribute("aria-label","شرح الصفحة "+(i+1));
    nb.onclick=()=>{ta.hidden=!ta.hidden;if(!ta.hidden)ta.focus()};
    ta.oninput=()=>{state[id].note=ta.value;nb.textContent=ta.value.trim()?"📝 تعديل الشرح":"📝 إضافة شرح";paintNote(i);store()};
    li.append(lab,nb,go,ta);ul.append(li)});
  pkCount();pkFilter()}
$("#pkSearch").oninput=pkFilter;
$("#pkAll").onclick=()=>{$("#pkList").querySelectorAll("li").forEach(li=>{if(li.hidden)return;const cb=li.querySelector("input[type=checkbox]");cb.checked=true;SEL.add(IDS[+li.dataset.i])});pkCount()};

/* Wipes old writing: clears the boxes in the page image itself and empties the fields */
async function wipePage(i){const id=IDS[i],im=await loadImg(PAGES[i]);const c=el("canvas");c.width=im.width;c.height=im.height;
  const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(im,0,0);cleanBoxes(ctx,c.width,c.height);PAGES[i]=c.toDataURL("image/jpeg",.8);
  state[id].ifada="";state[id].coords="";const sh=$("#list").querySelectorAll(".sheet")[i];if(sh){sh.querySelector("img").src=PAGES[i];for(const k of ["ifada","coords"]){const t=sh.querySelector("#"+k+"_"+i);if(t)t.value=""}}
  store()}
function loadImg(src){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=src})}
async function shrink(file){const u=URL.createObjectURL(file);try{const im=await loadImg(u);const r=Math.min(1,1400/Math.max(im.width,im.height));
  const c=el("canvas");c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return c.toDataURL("image/jpeg",.85)}finally{URL.revokeObjectURL(u)}}
function wrapLines(ctx,text,maxW){
  const lines=[];
  const segments=word=>typeof Intl!=="undefined"&&Intl.Segmenter?[...new Intl.Segmenter("ar",{granularity:"grapheme"}).segment(word)].map(x=>x.segment):Array.from(word);
  for(const para of String(text).replace(/\r\n?/g,"\n").split("\n")){
    let line="";

async function encryptReport(payload){

}
async function decryptReport(stored,hex){

  if(!stored||stored.v!==1||typeof stored.iv!=="string"||typeof stored.cipher!=="string")throw Error("بيانات النموذج غير متاحة");
  const key=await crypto.subtle.importKey("raw",fromHex(hex),"AES-GCM",false,["decrypt"]);
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:decode64(stored.iv)},key,decode64(stored.cipher))))}
  catch(e){throw Error("تعذّر قراءة النموذج. تأكد من نسخ الرابط كاملاً")}
}

      test.disabled=true;test.textContent="جارٍ الفحص…";result.style.color="var(--fg)";result.textContent="جارٍ فحص صلاحيات استقبال الملفات…";
      try{await verifySubmissionSetup();result.style.color="var(--ok)";result.textContent="✅ الاستقبال مفعّل. اضغط رابط للمستلم أعلى الصفحة لإنشاء رابط جديد يدعم إعادة PDF المعدّل إلى لوحة التحكم."}
      catch(e){result.style.color="var(--rust)";result.textContent="❌ "+(e.name==="AbortError"?"انتهى وقت الانتظار. تأكد من الإنترنت ثم أعد الفحص.":(e.message||String(e)))+"\nإذا كانت المشكلة في الصلاحيات: انسخ القواعد أعلاه، والصقها في Firebase ← Realtime Database ← Rules، ثم اضغط Publish."}
      finally{test.disabled=false;test.textContent="فحص تفعيل الاستقبال";result.scrollIntoView({behavior:"smooth",block:"center"})}
    };
    host.append(area,copy,test,result,el("a",{href:"https://console.firebase.google.com/",target:"_blank",rel:"noopener",textContent:"فتح Firebase"}));
  }catch(e){host.textContent=e.message||String(e)}
}
async function verifySubmissionSetup(){
  const path="submissionKeys/_check_"+toHex(crypto.getRandomValues(new Uint8Array(8)));
  await ownerRequest(path,"PUT",{test:true});
  try{
    const r=await fetch(FB_DB+"/"+path+".json",{cache:"no-store"});
    if(r.ok)throw Error("قواعد مفاتيح الاستقبال تسمح بقراءة عامة. طبّق القواعد من إعداد استقبال الملفات");
    if(r.status!==401&&r.status!==403)throw Error("تعذّر فحص خصوصية الاستقبال؛ حاول مرة أخرى");
  }finally{await ownerRequest(path,"DELETE")}
}
async function sealSubmission(payload,hex){
  const plain=new TextEncoder().encode(JSON.stringify(payload));if(plain.length>40*1024*1024)throw Error("ملف الرد كبير؛ قلّل حجم الصور ثم أعد الإرسال");
  const iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.importKey("raw",fromHex(hex),"AES-GCM",false,["encrypt"]);
  return {v:1,iv:bytes64(iv),cipher:bytes64(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain)))};
}
async function sendSubmission(pdf,confirmed=false){
  if(!confirmed)throw Error("يجب تأكيد الإرسال أولاً");
  if(!EMB?.returnToken)throw Error("اطلب رابط استقبال جديدًا من المرسل");
  if(SUBMISSION_SENT)return;
  await fetchRemote();if(stopped()){closeNow();throw Error("الملف موقوف أو انتهت صلاحيته أو لا يوجد اتصال")}
  let prev=null;try{prev=await requestJSON("submissions/"+EMB.fid+"/sentAt")}catch(_){}
  const key=new URLSearchParams(location.hash.slice(1)).get("k");
  // data: نص وصور كل صفحة ليُدمجها المرسل في ملفه الكامل
  const data=Object.fromEntries(IDS.map(id=>[id,{ifada:state[id].ifada||"",coords:state[id].coords||"",before:state[id].before||"",after:state[id].after||""}]));
  const sealed=await sealSubmission({kind:"recipient_submission",fid:EMB.fid,name:pdfName(),pdf:bytes64(new Uint8Array(await pdf.arrayBuffer())),data},key);
  try{
    await requestJSON("submissions/"+EMB.fid,"PUT",{...sealed,token:EMB.returnToken,status:"received",sentAt:{".sv":"timestamp"}});
  }catch(e){
    // If the write completed but its response was lost, the public sentAt leaf confirms delivery.
    let at;try{at=await requestJSON("submissions/"+EMB.fid+"/sentAt")}catch(_){}
    if(!(Number.isFinite(at)&&at!==prev)){
      if(HAS_SENT&&/صلاحيات/.test(e.message||""))throw Error("إعادة الإرسال غير مفعّلة؛ أرسل الملف بالواتساب أو الإيميل، أو اطلب من المرسل تحديث قواعد Firebase");
      throw e;
    }
  }
  const resent=HAS_SENT;SUBMISSION_SENT=true;HAS_SENT=true;await saveDraft();toast(resent?"تم إرسال التعديل للمرسل بنجاح":"تم إرسال الملف المعدّل للمرسل بنجاح");
}
function setEditable(on){
  document.querySelectorAll(".sheet textarea").forEach(e=>e.readOnly=!on);
  document.querySelectorAll(".sheet .pick,.sheet .wipe,#btnWipeAll").forEach(e=>{e.disabled=!on;e.hidden=!on});
}
function lockSubmissionUI(){
  if(!SUBMISSION_SENT||!canReturn())return;
  const btn=$("#btnPdf");btn.disabled=true;btn.textContent="✅ تم الإرسال";setEditable(false);
  const d=$("#done");d.hidden=false;d.innerHTML="";
  const ed=el("button",{type:"button",className:"b-link",textContent:"✏️ تعديل"});
  ed.onclick=async()=>{ed.disabled=true;await fetchRemote();if(stopped()){closeNow();return}
    SUBMISSION_SENT=false;setEditable(true);btn.disabled=false;btn.textContent="📤 إعادة الإرسال للمرسل";
    d.innerHTML="";d.append(el("span",{textContent:"✏️ عدّل الكتابة أو غيّر الصور، ثم اضغط «إعادة الإرسال للمرسل»."}));toast("يمكنك التعديل الآن")};
  d.append(el("span",{textContent:"✅ تم استلام ملفك المعدّل في لوحة تحكم المرسل."}),ed);
}
async function verifiedSubmission(fid){
  const [stored,secret]=await Promise.all([ownerRequest("submissions/"+fid),ownerRequest("submissionKeys/"+fid)]);
  if(!stored||stored.status!=="received"||!secret?.key||!Number.isFinite(stored.sentAt))throw Error("لا يوجد رد مكتمل");
  const result=await decryptReport(stored,secret.key);
  if(result.fid&&result.fid!==fid)throw Error("ملف الرد لا يخص هذا الرابط");
  if(typeof result.pdf!=="string"||!result.pdf.startsWith("JVBERi0"))throw Error("الرد ليس ملف PDF سليمًا");
  return {result,sentAt:stored.sentAt};
}
async function openSubmission(file,button){
  if(!authGet()){needLogin();return}button.disabled=true;
  try{
    const {result,sentAt}=await verifiedSubmission(file.fid);VERIFIED_REPLIES.set(file.fid,{result,sentAt});
    offer(new Blob([decode64(result.pdf)],{type:"application/pdf"}),result.name||file.name+" - معبأ.pdf","application/pdf",false);
    $("#done").scrollIntoView({behavior:"smooth",block:"center"});
  }catch(e){toast("تعذّر فتح الرد: "+(e.message||e))}finally{button.disabled=false}
}
