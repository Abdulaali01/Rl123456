<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">

<title>تعبئة البلاغات</title>

<style id="css">*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a working ledger — sticky action bar, one report sheet per row, inputs laid over the sheet's own boxes */
:root{
  --bg:#eef1f4; --paper:#ffffff; --fg:#1d2a36; --muted:#5b6b7a; --line:#cfd7df;
  --navy:#203a4c; --rust:#c2410c; --ok:#15803d; --field:rgba(255,251,214,.55); --fieldline:#203a4c;
  --display:"Cairo","Segoe UI",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a21;--paper:#1a252f;--fg:#e4eaf0;--muted:#9aabba;--line:#2e3d4a;--navy:#5b8db0;--rust:#f97316;--ok:#22c55e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a21;--paper:#1a252f;--fg:#e4eaf0;--muted:#9aabba;--line:#2e3d4a;--navy:#5b8db0;--rust:#f97316;--ok:#22c55e;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
header .in{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-family:var(--display);font-size:1.15rem;font-weight:800;margin:0;flex:1 1 180px;text-wrap:balance}
.status{font-size:.8rem;color:var(--muted);flex-basis:100%;order:3}
button{font-family:var(--display);font-weight:700;font-size:.9rem;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;color:#fff}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--rust);outline-offset:2px}
.b-link{background:var(--navy)} .b-pdf{background:var(--rust)} .b-wa{background:#1f9e55}
button:disabled{opacity:.6;cursor:wait}
.list{display:grid;gap:18px}
.sheet{position:relative;container-type:inline-size;background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;aspect-ratio:910/1287;max-width:100%}
.sheet img{display:block;width:100%;height:100%}
.sheet textarea{position:absolute;box-sizing:border-box;resize:none;border:1.5px dashed var(--fieldline);background:var(--field);color:#111;font-family:var(--display);font-weight:700;font-size:3.4cqw;line-height:1.5;padding:1.2cqw 1.4cqw;direction:rtl;text-align:right;border-radius:2px}
.sheet textarea{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;overflow:auto;max-width:100%}
.sheet textarea.c{font-size:3cqw}
.sheet textarea::placeholder{color:#7a8794;font-weight:500}
.sheet textarea:focus{background:rgba(255,255,255,.9);border-style:solid}
.sheet textarea[readonly]{border-style:solid;border-color:var(--line)}
.tag{position:absolute;top:1.2cqw;left:1.2cqw;font:600 2.2cqw var(--body);background:var(--paper);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:.4cqw 1.6cqw}
.tag.saved{color:var(--ok)}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:24px}
.gate form:empty{display:none}.gate form{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(340px,100%);display:grid;gap:12px;text-align:center}
.gate h2{font-family:var(--display);margin:0;font-size:1.2rem}
.gate p{margin:0;color:var(--muted);font-size:.9rem}
.gate input{font:700 1.4rem var(--display);text-align:center;letter-spacing:.3em;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.gate .err{color:var(--rust);min-height:1.2em;font-size:.85rem}
.gate button{background:var(--navy);font-size:1rem}
.slot{position:absolute;top:7.2%;height:36.3%;width:36.9%;background:#fff;display:flex;align-items:center;justify-content:center;pointer-events:none}
.slot img{width:100%;height:100%;object-fit:contain}
.slot .lab{position:absolute;top:1.2cqw;font:800 3cqw var(--display);color:#fff;padding:.4cqw 2.2cqw;border-radius:2cqw;border:2px solid #fff}
.slot.before .lab{right:1.2cqw;background:#c2410c} .slot.after .lab{right:1.2cqw;background:#15803d}
.pick{position:absolute;bottom:58.5%;font:700 2.6cqw var(--display);padding:1cqw 2cqw;border-radius:1.4cqw;background:var(--navy);color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2}
.pick.before{right:13%} .pick.after{right:51.5%}
.wipe{position:absolute;left:38.4%;top:92%;font:700 2.6cqw var(--display);padding:1cqw 2cqw;border-radius:1.4cqw;background:#b91c1c;color:#fff;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:2}
.b-wipe{background:#b91c1c} .b-mail{background:#2563eb}
.hrs input[type=checkbox]{width:18px;height:18px;accent-color:var(--navy)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-family:var(--display);font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.linkbox{flex-basis:100%;display:flex;gap:6px}
.linkbox input{flex:1;min-width:0;font:400 .85rem var(--body);direction:ltr;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.b-send{background:var(--ok)}
.done{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.done a{font-family:var(--display);font-weight:700;color:#fff;background:var(--navy);padding:9px 14px;border-radius:8px;text-decoration:none}
.hrs{display:flex;align-items:center;gap:6px;font:700 .85rem var(--display);color:var(--muted)}.hrs select{font:700 .9rem var(--display);padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.sent{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}.sent summary{font:800 1rem var(--display);cursor:pointer}.sent p{color:var(--muted);font-size:.85rem}.sent ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}.sent li{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}.sent li span{flex:1 1 200px;min-width:0}.sent code{font:700 1.05rem monospace;direction:ltr;user-select:all}
.owner.ask{outline:3px solid var(--rust);outline-offset:4px;border-radius:8px}.owner .lmsg{flex-basis:100%;color:var(--rust);font-size:.85rem;direction:rtl;word-break:break-word}.owner b{flex-basis:100%;font-family:var(--display)}.owner{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;margin:8px 0}.owner input{flex:1 1 140px;min-width:0;font:400 .9rem var(--body);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}.sent .ctl{display:flex;flex-wrap:wrap;gap:6px;flex-basis:100%}.sent .ctl select{font:700 .85rem var(--display);padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}.sent .ctl button,.sent li>button{padding:7px 10px;font-size:.82rem}.stt{font-style:normal;font-size:.8rem;flex-basis:100%;color:var(--muted)}.stt.on{color:var(--ok)}.stt.off{color:var(--rust)}
.empty{display:grid;gap:6px;text-align:center;padding:48px 16px;border:2px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty b{font-family:var(--display);font-size:1.15rem;color:var(--fg)}
/* قائمة الصفحات: بحث، اختيار، وشرح لكل صفحة */
.picker{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px}
.picker summary{font:800 1rem var(--display);cursor:pointer}
.picker summary span{font:600 .85rem var(--body);color:var(--ok)}
.pk-top{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pk-top input{flex:1 1 100%;min-width:0;font:400 .95rem var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.pk-top button{padding:7px 10px;font-size:.82rem}
#pkList{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:55vh;overflow:auto;overscroll-behavior:contain}
#pkList li{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:6px}
.pk-lab{flex:1 1 150px;display:flex;align-items:center;gap:8px;cursor:pointer;min-width:0;font-family:var(--display)}
.pk-lab input{width:20px;height:20px;flex:none;accent-color:var(--navy)}
.pk-lab small{color:var(--muted);font:400 .78rem var(--body);direction:ltr;overflow-wrap:anywhere;min-width:0}
#pkList li button{padding:6px 10px;font-size:.8rem}
.pk-note{flex-basis:100%;min-height:72px;font:400 .95rem var(--body);padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);resize:vertical}
.pk-empty{color:var(--muted);font-size:.85rem;margin:6px 0}
.pnote{background:var(--paper);color:var(--fg);border:1px solid var(--line);border-right:4px solid var(--rust);border-radius:8px;padding:10px 12px;font:600 .95rem var(--body);white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:-10px}

/* ===== v11: واجهة احترافية — شريط علوي، قائمة جانبية، تسجيل دخول ===== */

button{min-height:44px;touch-action:manipulation;transition:filter .15s,transform .05s}
button:active{transform:scale(.98)}button:hover{filter:brightness(1.08)}
.side{position:fixed;z-index:15;top:0;bottom:0;right:0;width:min(300px,86vw);background:var(--paper);border-left:1px solid var(--line);
  overflow-y:auto;overscroll-behavior:contain;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));
  transform:translateX(105%);transition:transform .22s ease;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
.side.open{transform:none}
.scrim{position:fixed;inset:0;z-index:14;background:rgba(10,20,30,.45)}
body.lock{overflow:hidden}
.grp{margin-bottom:18px}

.acts{display:grid;gap:8px}

@media (min-width:900px){
  .menu{display:none}
  .side{top:calc(var(--barh) + env(safe-area-inset-top,0px));width:var(--sidew);transform:none;box-shadow:none;padding-top:18px}
  .scrim{display:none}
  .side:not([hidden]) ~ main.wrap{max-width:none;margin:0;padding-right:calc(var(--sidew) + 28px);padding-left:28px}
  main.wrap>*{max-width:860px;margin-inline:auto}
}
.statusbox{margin-bottom:14px}
.statusbox .status{font-size:.85rem;color:var(--muted)}
.statusbox .done{margin-top:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.done a{display:inline-flex;align-items:center;min-height:44px}
.linkcard{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--ok);border-radius:12px;padding:14px;margin-bottom:16px;display:grid;gap:12px}
.linkcard h2{font:800 1.05rem var(--display);margin:0}

  padding:max(24px,env(safe-area-inset-top,0px)) 16px max(24px,env(safe-area-inset-bottom,0px));

/* ---- الكتابة السابقة: تُقرأ من الملف وتُمسح من خلفية الصفحة لتظهر قابلة للتعديل ---- */
function boxText(items,vp,W,H,k,bx){
  const b=(bx&&bx[k])||BOX[k],x0=b[0]/100*W,y0=b[1]/100*H,x1=x0+b[2]/100*W,y1=y0+b[3]/100*H,rows=[];
  for(const it of items){if(!it.str||!it.str.trim())continue;
    const m=pdfjsLib.Util.transform(vp.transform,it.transform),x=m[4],y=m[5],w=(it.width||0)*vp.scale,cx=x+w/2,fh=Math.hypot(m[2],m[3])||10;
    if(cx<x0||cx>x1||y<y0||y>y1+4)continue;
    let r=rows.find(r=>Math.abs(r.y-y)<Math.max(4,fh*.5));if(!r){r={y,p:[]};rows.push(r)}r.p.push({x,s:it.str})}
  rows.sort((a,b)=>a.y-b.y);
  return rows.map(r=>{const rtl=r.p.some(p=>/[\u0600-\u06FF]/.test(p.s));r.p.sort((a,b)=>rtl?b.x-a.x:a.x-b.x);return r.p.map(p=>p.s).join(" ").replace(/\s+/g," ").trim()}).filter(Boolean).join("\n");
}
function cleanRect(ctx,W,X,Y,BW,BH,dashed){const i=Math.max(3,W*.004),x=Math.round(X+i),y=Math.round(Y+i),w=Math.round(BW-2*i),h=Math.round(BH-2*i);let fill="#fff";
  if(w>=4&&h>=4){const d=ctx.getImageData(x,y,w,h).data,cnt=new Map();let best=null,bn=0;
    for(let yy=0;yy<h;yy+=3)for(let xx=0;xx<w;xx+=3){const p=(yy*w+xx)*4,q=(d[p]>>4)<<8|(d[p+1]>>4)<<4|(d[p+2]>>4);
      const e=cnt.get(q)||{n:0,r:0,g:0,b:0};e.n++;e.r+=d[p];e.g+=d[p+1];e.b+=d[p+2];cnt.set(q,e);if(e.n>bn){bn=e.n;best=e}}
    if(best)fill=`rgb(${Math.round(best.r/best.n)},${Math.round(best.g/best.n)},${Math.round(best.b/best.n)})`}
  const RX=Math.round(X)-1,RY=Math.round(Y)-1,RW=Math.round(BW)+2,RH=Math.round(BH)+2;ctx.fillStyle=fill;ctx.fillRect(RX,RY,RW,RH);
  if(dashed){ctx.save();ctx.setLineDash([Math.max(3,W*.004),Math.max(2,W*.003)]);ctx.lineWidth=Math.max(1,W*.0015);ctx.strokeStyle="#203a4c";
    const g=Math.max(3,W*.004);ctx.strokeRect(RX+g,RY+g,RW-2*g,RH-2*g);ctx.restore()}}
function cleanBoxes(ctx,W,H,bx){for(const k of ["ifada","coords"]){const b=(bx&&bx[k])||BOX[k];cleanRect(ctx,W,b[0]/100*W,b[1]/100*H,b[2]/100*W,b[3]/100*H,true)}}
const boxOf=(i,k)=>{const st=state[IDS[i]];return (st&&st.box&&st.box[k])||BOX[k]};
/* يكتشف مكان مربعي الإفادة/الوصف والإحداثيات في كل صفحة: الشريط الملوّن للعنوان ثم المساحة تحته حتى الحد السفلي */
function detectBoxes(ctx,W,H){const out={};let d;try{d=ctx.getImageData(0,0,W,H).data}catch(_){return out}
  const lum=(x,y)=>{const p=(y*W+x)*4;return .299*d[p]+.587*d[p+1]+.114*d[p+2]};
  for(const k of ["ifada","coords"]){const b=BOX[k];
    const xa=Math.round((b[0]+b[2]*.25)/100*W),xb=Math.round((b[0]+b[2]*.75)/100*W),cx=Math.round((b[0]+b[2]/2)/100*W);
    const ya=Math.max(0,Math.round((b[1]-14)/100*H)),yb=Math.min(H-1,Math.round((b[1]+b[3]+6)/100*H));
    const darkRow=y=>{let n=0,t=0;for(let x=xa;x<=xb;x+=3){t++;if(lum(x,y)<150)n++}return n/t>=.8};
    const runs=[];let s0=-1;for(let y=ya;y<H;y++){const dk=darkRow(y);if(dk&&s0<0)s0=y;if(!dk&&s0>=0){runs.push([s0,y-1]);s0=-1}}if(s0>=0)runs.push([s0,H-1]);
    let best=null;
    runs.forEach((r,j)=>{if(r[0]>yb||r[1]-r[0]+1<.008*H||r[1]-r[0]+1>.045*H)return;const top=r[1]+1,nx=runs[j+1],bot=nx?nx[0]-1:H-2,h=bot-top;
      if(h<.06*H)return;if(!best||h>best.h)best={bar:r,top,h}});
    if(!best)continue;
    const my=Math.round((best.bar[0]+best.bar[1])/2);let L=cx,R=cx,gap=0;
    for(let x=cx;x>=0;x--){if(lum(x,my)<150){L=x;gap=0}else if(++gap>.015*W)break}
    gap=0;for(let x=cx;x<W;x++){if(lum(x,my)<150){R=x;gap=0}else if(++gap>.015*W)break}
    if(R-L<.15*W)continue;
    const ix=.007*W,iy=.005*H;
    out[k]=[(L+ix)/W*100,(best.top+iy)/H*100,(R-L-2*ix)/W*100,(best.h-2*iy)/H*100].map(v=>+v.toFixed(2))}
  return out}

  if(ch){build();store()}}
function readEmbedded(raw){try{const head=new TextDecoder("latin1").decode(raw.subarray(0,Math.min(raw.length,8e6)));const m=head.match(/%TAIF:([A-Za-z0-9+\/=]+)/);if(!m)return null;

function wrapLines(ctx,text,maxW){

      if(ctx.measureText(candidate).width<=maxW){line=candidate;continue}
      if(line){lines.push(line);line=""}
      if(ctx.measureText(word).width<=maxW){line=word;continue}
      for(const part of segments(word)){

function bytes64(bytes){let s="";for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(s)}
function decode64(s){return Uint8Array.from(atob(s),ch=>ch.charCodeAt(0))}
async function encryptReport(payload){
  if(!crypto.subtle)throw Error("افتح الموقع المنشور عبر HTTPS لإنشاء رابط");
  const raw=crypto.getRandomValues(new Uint8Array(32)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["encrypt"]);
  const plain=new TextEncoder().encode(JSON.stringify(payload));
  if(plain.length>40*1024*1024)throw Error("الملف كبير لإنشاء رابط واحد؛ قسّمه إلى ملفات أصغر");
  const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain);
  return {key:toHex(raw),stored:{v:1,iv:bytes64(iv),cipher:bytes64(new Uint8Array(cipher))}};
}
async function decryptReport(stored,hex){
  if(!/^[a-f0-9]{64}$/i.test(hex||""))throw Error("الرابط ناقص. افتح الرابط كاملاً كما أرسله صاحب الملف");
  if(!stored||stored.v!==1||typeof stored.iv!=="string"||typeof stored.cipher!=="string")throw Error("بيانات النموذج غير متاحة");
  const key=await crypto.subtle.importKey("raw",fromHex(hex),"AES-GCM",false,["decrypt"]);
  try{return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:decode64(stored.iv)},key,decode64(stored.cipher))))}
  catch(e){throw Error("تعذّر قراءة النموذج. تأكد من نسخ الرابط كاملاً")}
}

/* Completed PDFs return to a private owner inbox, without a recipient login. The recipient may edit and resend while the link is active. */
async function requestJSON(path,method="GET",body,token){
  const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),body?.cipher?60000:12000);
  try{
    const url=FB_DB+"/"+path+".json"+(token?"?auth="+encodeURIComponent(token):"");
    const r=await fetch(url,{method,cache:"no-store",signal:ctl.signal,headers:body===undefined?{}:{"Content-Type":"application/json"},body:body===undefined?undefined:JSON.stringify(body)});
    if(!r.ok)throw Error((r.status===401||r.status===403)?"صلاحيات استقبال الملفات غير مفعّلة. على المرسل فتح إعداد استقبال الملفات وتطبيق القواعد":"خطأ اتصال "+r.status);
    return await r.json();
  }finally{clearTimeout(timer)}
}
async function ownerRequest(path,method="GET",body){const t=await idToken();if(!t)throw Error("سجّل الدخول أولاً");return requestJSON(path,method,body,t)}
async function submissionStatus(fid){return requestJSON("submissions/"+fid+"/status")}

function rulesForOwner(uid){

  const canSubmit="newData.exists() && root.child('files').child($fid).child('active').val() === true && root.child('files').child($fid).child('deleted').val() !== true && root.child('files').child($fid).child('until').val() >= now && newData.child('token').isString() && newData.child('token').val() === root.child('submissionKeys').child($fid).child('token').val()";
  return {rules:{".read":false,".write":false,
    files:{".read":owner,".write":owner,"$fid":{".read":true}},
    submissionKeys:{".read":owner,".write":owner},
    submissions:{".read":owner,"$fid":{
      ".write":"("+owner+") || ("+canSubmit+")",
      ".validate":"newData.hasChildren(['v','iv','cipher','token','status','sentAt']) && newData.child('v').val() === 1 && newData.child('iv').isString() && newData.child('iv').val().length === 16 && newData.child('cipher').isString() && newData.child('cipher').val().length <= 60000000 && newData.child('status').val() === 'received' && newData.child('sentAt').isNumber() && newData.child('sentAt').val() <= now && newData.child('sentAt').val() >= now - 60000",

  }finally{await ownerRequest(path,"DELETE")}

async function sealSubmission(payload,hex){
  const plain=new TextEncoder().encode(JSON.stringify(payload));if(plain.length>40*1024*1024)throw Error("ملف الرد كبير؛ قلّل حجم الصور ثم أعد الإرسال");
  const iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.importKey("raw",fromHex(hex),"AES-GCM",false,["encrypt"]);
  return {v:1,iv:bytes64(iv),cipher:bytes64(new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,plain)))};
}
async function sendSubmission(pdf,confirmed=false){
  if(!confirmed)throw Error("يجب تأكيد الإرسال أولاً");
  if(!EMB?.returnToken)throw Error("اطلب رابط استقبال جديدًا من المرسل");
  if(SUBMISSION_SENT)return;
  await fetchRemote();if(stopped()){closeNow();throw Error("الملف موقوف أو انتهت صلاحيته أو لا يوجد اتصال")}
  let prev=null;try{prev=await requestJSON("submissions/"+EMB.fid+"/sentAt")}catch(_){}
  const key=new URLSearchParams(location.hash.slice(1)).get("k");
  // data: نص وصور كل صفحة ليُدمجها المرسل في ملفه الكامل
  const data=Object.fromEntries(IDS.map(id=>[id,Object.fromEntries(["ifada","coords","before","after"].filter(fieldOn).map(k=>[k,state[id][k]||""]))]));
  const sealed=await sealSubmission({kind:"recipient_submission",fid:EMB.fid,name:pdfName(),pdf:bytes64(new Uint8Array(await pdf.arrayBuffer())),data},key);
  try{
    await requestJSON("submissions/"+EMB.fid,"PUT",{...sealed,token:EMB.returnToken,status:"received",sentAt:{".sv":"timestamp"}});
  }catch(e){
    // If the write completed but its response was lost, the public sentAt leaf confirms delivery.
    let at;try{at=await requestJSON("submissions/"+EMB.fid+"/sentAt")}catch(_){}
    if(!(Number.isFinite(at)&&at!==prev)){
      if(HAS_SENT&&/صلاحيات/.test(e.message||""))throw Error("إعادة الإرسال غير مفعّلة؛ أرسل الملف بالواتساب أو الإيميل، أو اطلب من المرسل تحديث قواعد Firebase");
      throw e;
    }
  }
  const resent=HAS_SENT;SUBMISSION_SENT=true;HAS_SENT=true;await saveDraft();toast("✅ تم الحفظ ووصل التعديل للمرسل");
}

async function verifiedSubmission(fid){
  const [stored,secret]=await Promise.all([ownerRequest("submissions/"+fid),ownerRequest("submissionKeys/"+fid)]);
  if(!stored||stored.status!=="received"||!secret?.key||!Number.isFinite(stored.sentAt))throw Error("لا يوجد رد مكتمل");
  const result=await decryptReport(stored,secret.key);
  if(result.fid&&result.fid!==fid)throw Error("ملف الرد لا يخص هذا الرابط");
  if(typeof result.pdf!=="string"||!result.pdf.startsWith("JVBERi0"))throw Error("الرد ليس ملف PDF سليمًا");
  return {result,sentAt:stored.sentAt};
}

    offer(new Blob([decode64(result.pdf)],{type:"application/pdf"}),result.name||file.name+" - معبأ.pdf","application/pdf",false);
    $("#done").scrollIntoView({behavior:"smooth",block:"center"});
  }catch(e){toast("تعذّر فتح الرد: "+(e.message||e))}finally{button.disabled=false}
}

</script>
</body></html>
